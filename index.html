<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>خانه هوشمند · فن و رله</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #121a2b;
    --line: #1e2a42;
    --text: #e8eefc;
    --muted: #8b9bb8;
    --on: #00c853;
    --off: #37474f;
    --fan: #ff9100;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2744 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.25rem; text-align: center; }
  .sub { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 6px 0 16px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;
  }
  .fan-box {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
  }
  .fan-visual {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #0d1524;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    position: relative;
  }
  .fan-blade {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg, var(--fan) 0 40deg, transparent 40deg 90deg,
        var(--fan) 90deg 130deg, transparent 130deg 180deg,
        var(--fan) 180deg 220deg, transparent 220deg 270deg,
        var(--fan) 270deg 310deg, transparent 310deg 360deg);
    animation: spin 2s linear infinite;
    animation-play-state: paused;
    opacity: 0.85;
  }
  .fan-blade.on { animation-play-state: running; }
  .fan-hub {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px var(--fan);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slider-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 160px;
  }
  .pwm-num {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--fan);
    text-align: center;
  }
  input[type=range].vert {
    -webkit-appearance: none;
    appearance: none;
    width: 140px;
    height: 28px;
    transform: rotate(-90deg);
    transform-origin: center;
    background: transparent;
    margin: 56px 0;
    cursor: pointer;
  }
  input[type=range].vert::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, #263238, var(--fan));
  }
  input[type=range].vert::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--fan);
    margin-top: -8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  input[type=range].vert::-moz-range-track {
    height: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, #263238, var(--fan));
  }
  input[type=range].vert::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--fan);
  }
  .fan-btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .fan-btns.two { grid-template-columns: 1fr 1fr; }
  button {
    border: none;
    border-radius: 14px;
    padding: 12px 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .b-on { background: linear-gradient(180deg, #00e676, var(--on)); color: #003310; }
  .b-off { background: #455a64; }
  .b-dim { background: #1a2438; border: 1px solid var(--line); color: var(--text); }
  .relay-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .relay {
    border-radius: 16px;
    padding: 14px 12px;
    background: #0d1524;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .relay .name { font-weight: 700; }
  .relay .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--off);
    box-shadow: inset 0 0 0 2px #546e7a;
  }
  .relay.active {
    border-color: rgba(0,200,83,.5);
    background: linear-gradient(135deg, #0d1f14, #0d1524);
  }
  .relay.active .dot {
    background: var(--on);
    box-shadow: 0 0 12px var(--on);
  }
  .settings label { display: block; font-size: 0.78rem; color: var(--muted); margin: 8px 0 4px; }
  .settings input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #0d1524;
    color: var(--text);
    font-family: inherit;
  }
  .log {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: ui-monospace, monospace;
    direction: ltr;
    text-align: left;
    min-height: 1.2em;
  }
  .hint { font-size: 0.75rem; color: var(--muted); line-height: 1.55; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>کنترل فن و رله‌ها</h1>
  <p class="sub">ولوم · اعمال بعد از رها کردن انگشت</p>

  <div class="panel">
    <h2>سرعت فن (PWM)</h2>
    <div class="fan-box">
      <div class="fan-visual">
        <div class="fan-blade" id="blade"></div>
        <div class="fan-hub"></div>
      </div>
      <div class="slider-col">
        <div class="pwm-num" id="pwmLabel">0</div>
        <input class="vert" id="slider" type="range" min="0" max="255" value="0" />
        <div style="font-size:0.72rem;color:var(--muted)">بالا = تندتر</div>
      </div>
    </div>
    <div class="fan-btns two">
      <button class="b-on" type="button" data-cmd="s180">روشن</button>
      <button class="b-off" type="button" data-cmd="s0">خاموش</button>
    </div>
    <div class="fan-btns" style="margin-top:8px;grid-template-columns:repeat(4,1fr)">
      <button class="b-dim" type="button" data-cmd="s50">50</button>
      <button class="b-dim" type="button" data-cmd="s100">100</button>
      <button class="b-dim" type="button" data-cmd="s180">180</button>
      <button class="b-dim" type="button" data-cmd="s255">255</button>
    </div>
  </div>

  <div class="panel">
    <h2>هشت رله</h2>
    <div class="relay-grid" id="relays"></div>
    <div class="fan-btns two" style="margin-top:12px">
      <button class="b-off" type="button" data-cmd="alloff" style="grid-column:1/-1">خاموش کردن همه رله‌ها</button>
    </div>
  </div>

  <div class="panel settings">
    <h2>آدرس کامپیوتر</h2>
    <label>مثال: http://192.168.1.10:8765</label>
    <input id="server" placeholder="http://192.168.1.10:8765" />
    <button class="b-dim" type="button" id="save" style="width:100%;margin-top:10px">ذخیره</button>
    <p class="hint">برنامه جاوا روی کامپیوتر روشن باشد. از ربات بله هم می‌توانید کنترل کنید.</p>
    <div class="log" id="log">آماده</div>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let pwm = 0;
  let relays = [false, false, false, false, false, false, false, false];

  $("server").value = localStorage.getItem("fr_server") || "http://192.168.1.10:8765";
  $("save").onclick = () => {
    localStorage.setItem("fr_server", $("server").value.trim());
    log("ذخیره شد");
  };

  const grid = $("relays");
  for (let i = 1; i <= 8; i++) {
    const el = document.createElement("div");
    el.className = "relay";
    el.dataset.n = i;
    el.innerHTML = '<span class="name">رله ' + i + '</span><span class="dot"></span>';
    el.onclick = () => toggleRelay(i);
    grid.appendChild(el);
  }

  function ui() {
    $("pwmLabel").textContent = String(pwm);
    $("slider").value = String(pwm);
    const blade = $("blade");
    if (pwm > 0) {
      blade.classList.add("on");
      blade.style.animationDuration = (2.5 - (pwm / 255) * 2.2).toFixed(2) + "s";
    } else {
      blade.classList.remove("on");
    }
    grid.querySelectorAll(".relay").forEach((el) => {
      const n = +el.dataset.n;
      el.classList.toggle("active", !!relays[n - 1]);
    });
  }

  function log(m) { $("log").textContent = m; }
  function base() { return $("server").value.trim().replace(/\/$/, ""); }

  async function send(cmd) {
    const url = base() + "/cmd?c=" + encodeURIComponent(cmd);
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, mode: "cors" });
      clearTimeout(t);
      const text = await res.text();
      log(text.replace(/\n/g, " | "));
      parseStatus(text);
      return text;
    } catch (e) {
      clearTimeout(t);
      log("خطا: " + (e.message || e));
      throw e;
    }
  }

  function parseStatus(text) {
    const m = /PWM\s*=\s*(\d+)/i.exec(text);
    if (m) pwm = +m[1];
    if (/Relays:/i.test(text)) {
      for (let i = 1; i <= 8; i++) {
        if (text.indexOf(i + "\u25CF") >= 0) relays[i - 1] = true;
        else if (text.indexOf(i + "\u25CB") >= 0) relays[i - 1] = false;
      }
    }
    ui();
  }

  const slider = $("slider");
  slider.addEventListener("input", () => {
    $("pwmLabel").textContent = slider.value;
  });
  slider.addEventListener("change", async () => {
    const v = +slider.value;
    pwm = v;
    ui();
    try { await send("s" + v); } catch (e) {}
  });

  async function toggleRelay(n) {
    try {
      await send("t" + n);
      relays[n - 1] = !relays[n - 1];
      ui();
    } catch (e) {}
  }

  document.querySelectorAll("[data-cmd]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try { await send(btn.getAttribute("data-cmd")); } catch (e) {}
    });
  });

  ui();
})();
</script>
</body>
</html>
