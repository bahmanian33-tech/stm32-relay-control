<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>خانه هوشمند · فن و رله</title>
<style>
  :root {
    --bg:#0a0e17;--card:#121a2b;--line:#1e2a42;--text:#e8eefc;
    --muted:#8b9bb8;--on:#00c853;--off:#37474f;--fan:#ff9100;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1a2744 0%,var(--bg) 55%);color:var(--text);min-height:100vh;padding:16px}
  .wrap{max-width:440px;margin:0 auto}
  h1{margin:0;font-size:1.25rem;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.8rem;margin:6px 0 14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
  .panel h2{margin:0 0 12px;font-size:.95rem;color:var(--muted);font-weight:600}
  .banner{background:#0d2a22;border:1px solid #1a5c4a;border-radius:14px;padding:12px;font-size:.82rem;line-height:1.6;margin-bottom:14px;color:#b6f5d8}
  .fan-box{display:flex;gap:18px;align-items:center;justify-content:center}
  .fan-visual{width:110px;height:110px;border-radius:50%;background:#0d1524;border:2px solid var(--line);display:grid;place-items:center;position:relative}
  .fan-blade{width:80px;height:80px;border-radius:50%;background:conic-gradient(from 0deg,var(--fan) 0 40deg,transparent 40deg 90deg,var(--fan) 90deg 130deg,transparent 130deg 180deg,var(--fan) 180deg 220deg,transparent 220deg 270deg,var(--fan) 270deg 310deg,transparent 310deg 360deg);animation:spin 2s linear infinite;animation-play-state:paused;opacity:.85}
  .fan-blade.on{animation-play-state:running}
  .fan-hub{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--fan)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .slider-col{display:flex;flex-direction:column;align-items:center;height:160px}
  .pwm-num{font-size:1.4rem;font-weight:700;color:var(--fan)}
  input[type=range].vert{-webkit-appearance:none;appearance:none;width:140px;height:28px;transform:rotate(-90deg);transform-origin:center;background:transparent;margin:56px 0;cursor:pointer}
  input[type=range].vert::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,#263238,var(--fan))}
  input[type=range].vert::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--fan);margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .btns.four{grid-template-columns:repeat(4,1fr)}
  button{border:none;border-radius:14px;padding:12px 8px;font-family:inherit;font-weight:700;font-size:.95rem;color:#fff;cursor:pointer}
  button:active{transform:scale(.97)}
  .b-on{background:linear-gradient(180deg,#00e676,var(--on));color:#003310}
  .b-off{background:#455a64}
  .b-dim{background:#1a2438;border:1px solid var(--line);color:var(--text)}
  .relay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .relay{border-radius:16px;padding:14px 12px;background:#0d1524;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .relay .name{font-weight:700}
  .relay .dot{width:14px;height:14px;border-radius:50%;background:var(--off);box-shadow:inset 0 0 0 2px #546e7a}
  .relay.active{border-color:rgba(0,200,83,.5);background:linear-gradient(135deg,#0d1f14,#0d1524)}
  .relay.active .dot{background:var(--on);box-shadow:0 0 12px var(--on)}
  .log{margin-top:10px;font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace;direction:ltr;text-align:left;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <h1>کنترل فن و رله‌ها</h1>
  <p class="sub">از همراه اول · بدون نیاز به وای‌فای خانه</p>
  <div class="banner">
    دکمه‌ها از <b>هر اینترنتی</b> (همراه اول) کار می‌کنند.
    فقط برنامه جاوا روی کامپیوتر باید روشن باشد.
    ربات بله هم مثل قبل جداگانه کار می‌کند.
  </div>

  <div class="panel">
    <h2>سرعت فن</h2>
    <div class="fan-box">
      <div class="fan-visual"><div class="fan-blade" id="blade"></div><div class="fan-hub"></div></div>
      <div class="slider-col">
        <div class="pwm-num" id="pwmLabel">0</div>
        <input class="vert" id="slider" type="range" min="0" max="255" value="0" />
        <div style="font-size:.72rem;color:var(--muted)">بعد از رها کردن</div>
      </div>
    </div>
    <div class="btns">
      <button class="b-on" type="button" data-cmd="s180">روشن</button>
      <button class="b-off" type="button" data-cmd="s0">خاموش</button>
    </div>
    <div class="btns four" style="margin-top:8px">
      <button class="b-dim" type="button" data-cmd="s50">50</button>
      <button class="b-dim" type="button" data-cmd="s100">100</button>
      <button class="b-dim" type="button" data-cmd="s180">180</button>
      <button class="b-dim" type="button" data-cmd="s255">255</button>
    </div>
  </div>

  <div class="panel">
    <h2>هشت رله</h2>
    <div class="relay-grid" id="relays"></div>
    <div class="btns" style="margin-top:12px">
      <button class="b-off" type="button" data-cmd="alloff" style="grid-column:1/-1">خاموش همه رله‌ها</button>
    </div>
    <div class="log" id="log">آماده</div>
  </div>
</div>
<script>
(function(){
  const TOPIC = "stm32-fan-relay-bahmanian";
  const NTFY = "https://ntfy.sh/" + TOPIC;
  const $ = id => document.getElementById(id);
  let pwm = 0;
  let relays = [0,0,0,0,0,0,0,0].map(()=>false);

  const grid = $("relays");
  for (let i=1;i<=8;i++){
    const el = document.createElement("div");
    el.className = "relay";
    el.dataset.n = i;
    el.innerHTML = '<span class="name">رله '+i+'</span><span class="dot"></span>';
    el.onclick = () => {
      relays[i-1] = !relays[i-1];
      ui();
      send("t"+i);
    };
    grid.appendChild(el);
  }

  function ui(){
    $("pwmLabel").textContent = String(pwm);
    $("slider").value = String(pwm);
    const b = $("blade");
    if (pwm>0){ b.classList.add("on"); b.style.animationDuration=(2.5-(pwm/255)*2.2).toFixed(2)+"s"; }
    else b.classList.remove("on");
    grid.querySelectorAll(".relay").forEach(el=>{
      el.classList.toggle("active", !!relays[+el.dataset.n-1]);
    });
  }
  function log(m){ $("log").textContent = m; }

  async function send(cmd){
    log("ارسال: "+cmd+" ...");
    try{
      const res = await fetch(NTFY, {
        method: "POST",
        body: cmd,
        headers: { "Content-Type": "text/plain; charset=UTF-8" }
      });
      if (res.ok) log("OK → "+cmd+" (منتظر برد)");
      else log("خطا HTTP "+res.status);
    }catch(e){
      log("خطا: "+(e.message||e));
    }
  }

  $("slider").addEventListener("input", ()=>{ $("pwmLabel").textContent = $("slider").value; });
  $("slider").addEventListener("change", ()=>{
    pwm = +$("slider").value;
    ui();
    send("s"+pwm);
  });

  document.querySelectorAll("[data-cmd]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = btn.getAttribute("data-cmd");
      if (c.startsWith("s")) { pwm = +c.slice(1); ui(); }
      send(c);
    });
  });

  ui();
})();
</script>
</body>
</html>
